name: Zherfai CI/CD Pipeline (Windows VST3)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-windows:
    runs-on: windows-2022

    env:
      JUCE_DISABLE_VST3_MANIFEST_CHECK: 1

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSVC Environment
      uses: ilammy/msvc-dev-cmd@v1

    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.28.x'

    - name: Configure CMake
      run: |
        cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DJUCE_BUILD_HELPER_APPLICATIONS=OFF

    - name: Build Plugin
      run: |
        cmake --build build --config Release --target ZherfaiAudioEngine_VST3 -- /v:m

    - name: Upload VST3 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ZherfaiAudioEngine-VST3-Windows
        path: |
          build/ZherfaiAudioEngine_artefacts/Release/VST3/
          build/Release/ZherfaiAudioEngine.vst3
